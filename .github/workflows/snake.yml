
name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate pink snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nesyass
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF69B4&color_dots=%23FCE7F1,%23F8BBD0,%23F48FB1,%23EC6AA9,%23D94A91
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF69B4&color_dots=%232B1827,%2354213F,%238E2C66,%23D94A91,%23FF8FC7

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
